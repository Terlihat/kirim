<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShareText Pro</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
</head>
<body class="dark-mode">
    <script>
        if (localStorage.getItem('theme') === 'light') document.body.classList.remove('dark-mode');
    </script>

    <div class="header-menu">
        <button id="theme-toggle">☀️ Terang</button>
        <div id="auth-status-bar">
            <button id="btn-show-auth">👤 Login</button>
        </div>
    </div>
    
    <div class="container">
        <!-- Section Dashboard -->
        <div id="dashboard-section" class="app-section hidden">
            <div class="section-header">
                <h3>🗂️ Dashboard</h3>
                <button id="btn-dashboard-back" class="btn-outline">Kembali</button>
            </div>
            <input type="text" id="dashboard-search" placeholder="🔍 Cari tautan atau tag..." autocomplete="off">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Tautan</th>
                            <th>Tag</th>
                            <th>Format</th>
                            <th>View</th>
                            <th>Password</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dashboard-list"></tbody>
                </table>
            </div>
        </div>

        <!-- Section Editor / Input -->
        <div id="editor-section" class="app-section">
            <div class="section-header" style="margin-bottom:15px; justify-content:center;">
                <h1 style="font-size: 2.2rem; margin:0;">📝 ShareText Pro</h1>
            </div>
            <p id="status-text" style="text-align: center; color: #7f8c8d; margin-bottom: 25px;">Bagikan teks dengan aman.</p>
            
            <textarea id="text-input" placeholder="Ketik atau paste teks/kode di sini..."></textarea>
            
            <div class="settings-grid">
                <div class="setting-group">
                    <label>Durasi:</label>
                    <select id="expire-select">
                        <option value="0">Selamanya</option>
                        <option value="10">10 Menit</option>
                        <option value="30">30 Menit</option>
                        <option value="60">1 Jam</option>
                        <option value="420">7 Jam</option>
                        <option value="720">12 Jam</option>
                        <option value="1440">1 Hari</option>
                        <option value="10080">7 Hari</option>
                        <option value="20160">14 Hari</option>
                        <option value="43200">30 Hari</option>
                        <option value="525600">1 Tahun</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Format:</label>
                    <select id="format-select">
                        <option value="text">Teks Normal</option>
                        <option value="code">Source Code</option>
                        <option value="markdown">Markdown</option>
                    </select>
                </div>
                <div class="setting-group">
                    <input type="text" id="text-tag" placeholder="Tag Identitas" autocomplete="off" name="txt_tag_prevent_autofill">
                </div>
                <div class="setting-group">
                    <input type="text" id="custom-url" placeholder="URL Kustom (Opsional)" autocomplete="new-password" name="cst_url_prevent_autofill">
                </div>
                <div class="setting-group">
                    <input type="password" id="password-input" placeholder="Password Server (Opsional)" autocomplete="new-password" name="srv_pass_prevent_autofill">
                </div>
                <div class="setting-group">
                    <input type="password" id="custom-e2ee-key" placeholder="Kunci E2EE (Opsional)" autocomplete="new-password" name="e2e_key_prevent_autofill">
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="is-burn"> 🔥 Hapus Otomatis (Burn)</label>
                    <label><input type="checkbox" id="is-e2ee"> 🛡️ Enkripsi E2EE</label>
                </div>
            </div>
            
            <div class="actions center-actions">
                <button id="btn-save" class="btn-wide">Bagikan Teks</button>
                <button id="btn-cancel-edit" class="btn-outline hidden">Batal Edit</button>
            </div>
        </div>

        <!-- Section Passphrase Lock -->
        <div id="password-section" class="app-section hidden">
            <h3 id="password-box-title">🔒 Terkunci</h3>
            <p id="password-box-desc"></p>
            <input type="password" id="read-password" autocomplete="new-password" name="crypt_open_prevent_autofill" placeholder="Masukkan kata sandi atau link E2EE..." style="margin:15px 0;">
            <div class="actions-vertical">
                <button id="btn-unlock">Buka Akses</button>
                <button id="btn-password-back" class="btn-outline">Kembali</button>
            </div>
        </div>

        <!-- Section Read Output -->
        <div id="read-section" class="app-section hidden">
            <div class="section-header" style="margin-bottom:15px;">
                <span id="view-count" style="font-weight:600; color:var(--primary-color);">View: 0</span>
                <div style="display:flex; gap:10px;">
                    <button id="btn-copy-content" class="btn-secondary">Salin Teks</button>
                    <button id="btn-read-new" class="btn-outline">Kembali</button>
                </div>
            </div>
            <div id="markdown-output" class="hidden"></div>
            <pre id="code-wrapper"><code id="code-output"></code></pre>
        </div>

        <!-- Section Share Link Result -->
        <div id="link-container" class="app-section hidden">
            <div class="section-header" style="margin-bottom:20px;">
                <h3 style="margin:0;">🎉 Tautan Berhasil Dibuat</h3>
                <button id="btn-back-to-editor" class="btn-outline">Kembali</button>
            </div>
            <div class="input-group">
                <input type="text" id="share-link" readonly>
                <button id="btn-copy">Copy</button>
            </div>
            <div class="qr-section">
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <!-- POP-UP MODAL AUTHENTIKASI -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="auth-title">Masuk</h3>
            <input type="email" id="auth-email" placeholder="Alamat Email" autocomplete="username" name="usr_mail_x">
            <input type="password" id="auth-password" placeholder="Kata Sandi" autocomplete="current-password" name="usr_pass_x">
            <button id="btn-auth-primary">Masuk</button>
            <p id="auth-toggle-text">Belum punya akun? <span id="switch-to-register">Daftar</span></p>
            <button id="btn-close-auth" class="btn-outline" style="margin-top:10px;">Tutup</button>
        </div>
    </div>

    <!-- POP-UP MODAL SISTEM (Peringatan/Konfirmasi/Prompt) -->
    <div id="sys-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 380px; text-align: center;">
            <h3 id="sys-modal-title">Info</h3>
            <p id="sys-modal-msg" style="margin-bottom: 20px; font-size: 0.95rem;"></p>
            <input type="text" id="sys-modal-input" class="hidden" style="margin-bottom: 20px;" autocomplete="off">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="sys-modal-ok">OK</button>
                <button id="sys-modal-cancel" class="btn-outline hidden">Batal</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
