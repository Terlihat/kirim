<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareText Pro Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 ShareText Clone</h1>
        <p id="status-text">Ketik atau paste teks Anda di bawah ini:</p>
        
        <textarea id="text-input" placeholder="Masukkan teks di sini..."></textarea>
        
        <!-- FITUR BARU: Pilihan Masa Berlaku -->
        <div id="expiry-container" class="setting-group">
            <label for="expire-select">Masa Berlaku Teks: </label>
            <select id="expire-select">
                <option value="0">Tanpa Batas (Selamanya)</option>
                <option value="10">10 Menit</option>
                <option value="60">1 Jam</option>
                <option value="1440">1 Hari (24 Jam)</option>
            </select>
        </div>
        
        <div class="actions">
            <button id="btn-save">Bagikan Teks</button>
            <a href="/" id="btn-new" style="display: none;"><button type="button">Buat Teks Baru</button></a>
        </div>

        <div id="link-container" class="hidden">
            <p>Teks berhasil disimpan! Bagikan link ini:</p>
            <div class="input-group">
                <input type="text" id="share-link" readonly>
                <button id="btn-copy">Copy Link</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
